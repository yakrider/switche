# we'll use codegen-backend to enable cranelift for dev
cargo-features = ["codegen-backend"]

[package]
name = "switche"
version = "4.0.1"
description = "Switche - Searchable Task Switcher"
authors = ["yakrider"]
keywords = ["switcher", "alt-tab", "task-switcher", "window-switcher" ]
license = "MIT"
repository = ""
edition = "2021"

# keep the historical capitalized exe name (external hotkey managers key off it)
[[bin]]
name = "Switche"
path = "src/main.rs"


[dependencies]
gpui = "=0.2.2"
async-channel = "2"
raw-window-handle = "0.6"
global-hotkey = "0.6"
smallvec = "1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
grouping_by = "0.2"
atomic_enum = "0.3"
strum_macros = "0.24"
#no_deadlocks = "1.3.0"
dirs = "5"
image = "0.25"
base64 = "0.21"
rand = "0.8"
quick-xml = "0.37"
toml_edit = "0.22"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time"] }
tracing-appender = "0.2"
mslnk = "0.1"

#planif = "1.0.0"
planif = { git = "https://github.com/yakrider/planif.git", branch = "yakrider" }




[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.20", features = ["common-controls-v6"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]




# we'll set general debug-info to lines-tables only to speed up compilation
# can remove this if we really need to debug, but should seldom be the case
[profile.dev]
debug = "line-tables-only"
codegen-backend = "cranelift"


